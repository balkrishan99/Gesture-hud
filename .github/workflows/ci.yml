name: CI — Lint & Import Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (headless)
        run: |
          pip install opencv-python-headless mediapipe numpy psutil pyautogui

      - name: Syntax check
        run: python -m py_compile src/main.py && echo "✅ Syntax OK"
